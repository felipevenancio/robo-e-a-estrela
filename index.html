<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>O Robô e a Estrela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8FD8FF;
    --sky-bottom:#D9F4FF;
    --grass:#7BC96F;
    --grass-dark:#5FAE55;
    --panel:#FFFDF7;
    --ink:#2B3A55;
    --sun:#FFD34D;
    --button:#4A7BF7;
    --button-dark:#2E5FE0;
    --button-off:#C9D3E6;
    --star-gold:#FFC93C;
    --medal-red:#FF5D5D;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Nunito', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, var(--grass) 55%, var(--grass-dark) 100%);
    overflow:hidden;
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    touch-action: manipulation;
  }

  #sun{
    position:absolute; top:22px; left:26px; width:56px; height:56px;
    background:var(--sun); border-radius:50%;
    box-shadow:0 0 0 8px rgba(255,211,77,0.35);
  }

  #title{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(20px,3.2vw,32px);
    color:#fff; text-shadow: 0 3px 0 rgba(43,58,85,0.35);
    text-align:center; letter-spacing:0.5px;
    pointer-events:none;
    z-index:5;
  }

  #stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }

  #canvas-wrap{
    width:min(94vmin, 780px);
    height:min(94vmin, 780px);
    margin-top:10px;
  }
  canvas{ display:block; }

  /* --- D-pad --- */
  #pad{
    position:absolute;
    bottom:22px; left:50%; transform:translateX(-50%);
    display:grid;
    grid-template-columns: 74px 74px 74px;
    grid-template-rows: 74px 74px;
    gap:10px;
    z-index:6;
  }
  .pad-btn{
    grid-row:2;
    border:none; border-radius:20px;
    background: var(--button);
    box-shadow: 0 7px 0 var(--button-dark);
    color:#fff; font-size:30px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform .05s ease, box-shadow .05s ease, background .15s ease;
  }
  .pad-btn:active{ transform: translateY(6px); box-shadow:0 1px 0 var(--button-dark); }
  #btn-up{ grid-column:2; grid-row:1; }
  #btn-left{ grid-column:1; }
  #btn-down{ grid-column:2; }
  #btn-right{ grid-column:3; }
  .pad-btn:disabled{
    background: var(--button-off);
    box-shadow: 0 7px 0 #A9B4C9;
    cursor:not-allowed;
    color:#eef1f7;
  }

  /* --- side controls --- */
  #topRight{
    position:absolute; top:16px; right:16px; z-index:6;
    display:flex; gap:10px;
  }
  .chip{
    background: var(--panel);
    border:none; border-radius:16px;
    padding:10px 16px;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px;
    color: var(--ink);
    box-shadow: 0 5px 0 rgba(43,58,85,0.25);
    cursor:pointer;
  }
  .chip:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(43,58,85,0.25); }

  /* --- code panel --- */
  #codePanel{
    position:absolute; top:74px; right:16px; width:240px; max-height:52vh;
    background: rgba(20,26,40,0.92);
    border-radius:16px;
    padding:14px 16px;
    color:#B9F6C6;
    font-family: 'Courier New', monospace;
    font-size:14px; line-height:1.65;
    overflow-y:auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    z-index:6;
    display:none;
  }
  #codePanel.show{ display:block; }
  #codePanel .empty{ color:#8FA0B8; font-style:italic; }
  #codePanel .line.current{ color:#FFD34D; font-weight:bold; }
  #codePanel .line.blocked{ color:#FF8A8A; }
  #codePanel .label{
    color:#7FB8FF; font-family:'Baloo 2',sans-serif; font-size:13px;
    margin-bottom:6px; letter-spacing:0.3px;
  }

  /* --- medal overlay --- */
  #overlay{
    position:absolute; inset:0;
    background: rgba(20,30,50,0.55);
    display:none;
    align-items:center; justify-content:center;
    z-index:20;
  }
  #overlay.show{ display:flex; }
  #medalCard{
    background:var(--panel);
    border-radius:28px;
    padding:38px 44px 32px;
    text-align:center;
    box-shadow:0 20px 0 rgba(43,58,85,0.25), 0 30px 60px rgba(0,0,0,0.4);
    max-width:90vw;
    transform: scale(0.85);
    animation: pop .45s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes pop{ to{ transform:scale(1); } }
  #medalIcon{ font-size:74px; line-height:1; margin-bottom:6px; }
  #medalTitle{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:30px;
    color:var(--ink); margin:6px 0 2px;
  }
  #medalSub{ font-size:16px; color:#5A6B8C; margin-bottom:20px; }
  #playAgain{
    border:none; border-radius:18px;
    background: var(--medal-red);
    box-shadow: 0 7px 0 #C93E3E;
    color:#fff; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px;
    padding:14px 30px; cursor:pointer;
  }
  #playAgain:active{ transform:translateY(6px); box-shadow:0 1px 0 #C93E3E; }

  .confetti{
    position:absolute; width:10px; height:16px; top:-20px; opacity:0.95;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(540deg); opacity:0.9; }
  }

  @media (max-width:560px){
    #codePanel{ display:none !important; }
    #topRight .chip[data-code]{ display:none; }
  }
</style>
</head>
<body>

  <div id="sun"></div>
  <div id="title">🤖 Programando o Robô</div>

  <div id="topRight">
    <button class="chip" data-code id="codeToggle">👨‍💻 Ver código</button>
    <button class="chip" id="resetBtn">🔄 Novo jogo</button>
  </div>

  <div id="codePanel">
    <div class="label">// programa do robô</div>
    <div id="codeLines"><span class="empty">// clique nas setas para começar...</span></div>
  </div>

  <div id="stage">
    <div id="canvas-wrap"></div>
  </div>

  <div id="pad">
    <button class="pad-btn" id="btn-up" title="Frente">⬆️</button>
    <button class="pad-btn" id="btn-left" title="Esquerda">⬅️</button>
    <button class="pad-btn" id="btn-down" title="Trás">⬇️</button>
    <button class="pad-btn" id="btn-right" title="Direita">➡️</button>
  </div>

  <div id="overlay">
    <div id="medalCard">
      <div id="medalIcon">🏅</div>
      <div id="medalTitle">Parabéns!</div>
      <div id="medalSub">Você programou o robô até a estrela! ⭐</div>
      <button id="playAgain">Jogar de novo</button>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

  // ---------- Config do tabuleiro ----------
  const SIZE = 10;          // 10 x 10
  const TILE = 1;           // tamanho de cada casa
  const HALF = (SIZE - 1) / 2;

  function gridToWorld(gx, gz){
    return { x: (gx - HALF) * TILE, z: (gz - HALF) * TILE };
  }

  const CENTER = Math.floor(SIZE / 2);
  let robotPos = { x: CENTER, z: CENTER };
  let starPos  = { x: 0, z: 0 };
  const CORNERS = [ {x:0,z:0}, {x:SIZE-1,z:0}, {x:0,z:SIZE-1}, {x:SIZE-1,z:SIZE-1} ];

  function randomCorner(){
    return CORNERS[Math.floor(Math.random()*CORNERS.length)];
  }

  // ---------- Three.js setup ----------
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  // sem scene.background: fica transparente, deixando o céu/grama da página aparecer atrás do tabuleiro
  scene.fog = new THREE.Fog(0xBEE7FF, 20, 34);

  // Câmera em 3ª pessoa: perspectiva de verdade (com profundidade), mais
  // próxima do robô, seguindo-o suavemente conforme ele anda pelo tabuleiro.
  const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
  function positionCamera(){
    const dist = SIZE * TILE * 1.3;
    camera.position.set(0, dist, dist * 0.8);
    camera.lookAt(0, 0, 0);
  }
  positionCamera();

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  wrap.appendChild(renderer.domElement);

  function resize(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // Lights
  const hemi = new THREE.HemisphereLight(0xffffff, 0x6b8f5a, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(6, 14, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
  sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
  scene.add(sun);

  // Board base (grass)
  const boardSize = SIZE * TILE;
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(boardSize + 0.4, 0.4, boardSize + 0.4),
    new THREE.MeshStandardMaterial({ color: 0x6BBF57, roughness:0.9 })
  );
  base.position.y = -0.4;
  base.receiveShadow = true;
  scene.add(base);

  // Checkerboard tiles
  const tileGroup = new THREE.Group();
  const colorA = 0x8FD87B, colorB = 0x7BC96F;
  for(let gx=0; gx<SIZE; gx++){
    for(let gz=0; gz<SIZE; gz++){
      const p = gridToWorld(gx,gz);
      const mat = new THREE.MeshStandardMaterial({
        color: ((gx+gz)%2===0) ? colorA : colorB,
        roughness:0.85
      });
      const tile = new THREE.Mesh(new THREE.BoxGeometry(TILE*0.96, 0.08, TILE*0.96), mat);
      tile.position.set(p.x, 0.02, p.z);
      tile.receiveShadow = true;
      tileGroup.add(tile);
    }
  }
  scene.add(tileGroup);

  // Border walls (low, decorative)
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xE8D8A0, roughness:0.9 });
  const wallH = 0.5;
  [
    {w:boardSize+0.6, d:0.3, x:0, z:-boardSize/2 - 0.15},
    {w:boardSize+0.6, d:0.3, x:0, z: boardSize/2 + 0.15},
    {w:0.3, d:boardSize+0.6, x:-boardSize/2 - 0.15, z:0},
    {w:0.3, d:boardSize+0.6, x: boardSize/2 + 0.15, z:0},
  ].forEach(function(s){
    const wall = new THREE.Mesh(new THREE.BoxGeometry(s.w, wallH, s.d), wallMat);
    wall.position.set(s.x, wallH/2 - 0.2, s.z);
    wall.castShadow = true; wall.receiveShadow = true;
    scene.add(wall);
  });

  // ---------- Robot ----------
  const robot = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4A7BF7, roughness:0.4, metalness:0.15 });
  const accentMat = new THREE.MeshStandardMaterial({ color: 0xFFD34D, roughness:0.4 });
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness:0.2 });
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x2B3A55, roughness:0.3 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), bodyMat);
  body.position.y = 0.45; body.castShadow = true;
  robot.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 16), bodyMat);
  head.position.y = 0.86; head.castShadow = true;
  robot.add(head);

  [-0.11, 0.11].forEach(function(dx){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.075,12,12), eyeMat);
    eye.position.set(dx, 0.9, 0.24);
    robot.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.035,10,10), pupilMat);
    pupil.position.set(dx, 0.9, 0.30);
    robot.add(pupil);
  });

  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.22,8), accentMat);
  antenna.position.y = 1.2;
  robot.add(antenna);
  const antennaTip = new THREE.Mesh(new THREE.SphereGeometry(0.06,10,10), accentMat);
  antennaTip.position.y = 1.32;
  robot.add(antennaTip);

  [-0.32, 0.32].forEach(function(dx){
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.32,0.12), accentMat);
    arm.position.set(dx, 0.45, 0);
    arm.castShadow = true;
    robot.add(arm);
  });

  scene.add(robot);

  // ---------- Star ----------
  function makeStarShape(){
    const shape = new THREE.Shape();
    const points = 5, outerR = 0.42, innerR = 0.18;
    for(let i=0;i<points*2;i++){
      const r = (i%2===0) ? outerR : innerR;
      const a = (Math.PI/points)*i - Math.PI/2;
      const px = Math.cos(a)*r, py = Math.sin(a)*r;
      if(i===0) shape.moveTo(px,py); else shape.lineTo(px,py);
    }
    shape.closePath();
    return shape;
  }
  const starGeo = new THREE.ExtrudeGeometry(makeStarShape(), { depth:0.12, bevelEnabled:true, bevelThickness:0.03, bevelSize:0.02, bevelSegments:2 });
  const starMat = new THREE.MeshStandardMaterial({ color: 0xFFC93C, emissive:0x6b4f00, emissiveIntensity:0.35, roughness:0.35, metalness:0.3 });
  const star = new THREE.Mesh(starGeo, starMat);
  star.rotation.x = Math.PI/2;
  star.position.y = 0.55;
  star.castShadow = true;
  scene.add(star);

  const starGlow = new THREE.PointLight(0xFFD34D, 1.1, 3.5);
  starGlow.position.y = 0.7;
  star.add(starGlow);

  // ---------- Barreiras (obstáculos vermelhos) ----------
  const obstacleGroup = new THREE.Group();
  scene.add(obstacleGroup);
  let obstacleSet = new Set();

  function cellKey(x, z){ return x + ',' + z; }

  function neighborsOf(x, z){
    return [[x+1,z],[x-1,z],[x,z+1],[x,z-1]].filter(function(n){
      return n[0] >= 0 && n[0] < SIZE && n[1] >= 0 && n[1] < SIZE;
    });
  }

  // BFS: garante que sempre exista um caminho livre até a estrela
  function pathExists(start, goal, blocked){
    const startKey = cellKey(start.x, start.z);
    const goalKey = cellKey(goal.x, goal.z);
    if(blocked.has(startKey) || blocked.has(goalKey)) return false;
    const visited = new Set([startKey]);
    const queue = [[start.x, start.z]];
    while(queue.length){
      const cur = queue.shift();
      if(cur[0] === goal.x && cur[1] === goal.z) return true;
      neighborsOf(cur[0], cur[1]).forEach(function(n){
        const key = cellKey(n[0], n[1]);
        if(!visited.has(key) && !blocked.has(key)){
          visited.add(key);
          queue.push(n);
        }
      });
    }
    return false;
  }

  function buildObstacleMeshes(){
    while(obstacleGroup.children.length){
      obstacleGroup.remove(obstacleGroup.children[0]);
    }
    obstacleSet.forEach(function(key){
      const parts = key.split(',');
      const gx = parseInt(parts[0], 10), gz = parseInt(parts[1], 10);
      const p = gridToWorld(gx, gz);
      const g = new THREE.Group();

      const redTile = new THREE.Mesh(
        new THREE.BoxGeometry(TILE*0.96, 0.09, TILE*0.96),
        new THREE.MeshStandardMaterial({ color: 0xE23B3B, roughness:0.7 })
      );
      redTile.position.y = 0.035;
      redTile.receiveShadow = true;
      g.add(redTile);

      const block = new THREE.Mesh(
        new THREE.BoxGeometry(0.58, 0.4, 0.58),
        new THREE.MeshStandardMaterial({ color: 0xC92A2A, roughness:0.55 })
      );
      block.position.y = 0.28;
      block.castShadow = true; block.receiveShadow = true;
      g.add(block);

      const stripe = new THREE.Mesh(
        new THREE.BoxGeometry(0.64, 0.1, 0.16),
        new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness:0.5 })
      );
      stripe.position.y = 0.28;
      stripe.rotation.y = Math.PI/4;
      g.add(stripe);

      g.position.set(p.x, 0, p.z);
      obstacleGroup.add(g);
    });
  }

  function generateObstacles(){
    const count = Math.max(3, Math.floor(SIZE * SIZE * 0.12));
    let attempts = 0;
    let chosen = new Set();
    while(attempts < 50){
      attempts++;
      const candidate = new Set();
      let guard = 0;
      while(candidate.size < count && guard < 400){
        guard++;
        const gx = Math.floor(Math.random() * SIZE);
        const gz = Math.floor(Math.random() * SIZE);
        if(gx === robotPos.x && gz === robotPos.z) continue;
        if(gx === starPos.x && gz === starPos.z) continue;
        if(Math.abs(gx - robotPos.x) + Math.abs(gz - robotPos.z) <= 1) continue;
        if(Math.abs(gx - starPos.x) + Math.abs(gz - starPos.z) <= 1) continue;
        candidate.add(cellKey(gx, gz));
      }
      if(pathExists(robotPos, starPos, candidate)){
        chosen = candidate;
        break;
      }
    }
    obstacleSet = chosen;
    buildObstacleMeshes();
  }

  // ---------- Placement ----------
  function placeStar(){
    starPos = randomCorner();
    const w = gridToWorld(starPos.x, starPos.z);
    star.position.x = w.x; star.position.z = w.z;
  }
  function placeRobot(instant){
    const w = gridToWorld(robotPos.x, robotPos.z);
    if(instant){
      robot.position.x = w.x; robot.position.z = w.z;
    }
  }
  placeRobot(true);
  placeStar();
  generateObstacles();

  // ---------- Animation loop (moves + idle bob) ----------
  let animTarget = null; // {x,z} world coords
  let animStart = null;
  let animFrom = null;
  const MOVE_MS = 260;

  function animateMoveTo(worldX, worldZ){
    animFrom = { x: robot.position.x, z: robot.position.z };
    animTarget = { x: worldX, z: worldZ };
    animStart = performance.now();
  }

  // Bump: pequena trombada quando o robô tenta entrar numa barreira
  let bumpAnim = null; // {base:{x,z}, dir:{x,z}, start}
  const BUMP_MS = 240;

  function startBump(dx, dz){
    const w = gridToWorld(robotPos.x, robotPos.z);
    bumpAnim = { base: { x: w.x, z: w.z }, dir: { x: dx, z: dz }, start: performance.now() };
  }

  let clock = new THREE.Clock();
  function tick(){
    requestAnimationFrame(tick);
    const t = clock.getElapsedTime();
    star.rotation.z = t * 1.2;
    star.position.y = 0.55 + Math.sin(t*2)*0.06;

    if(animTarget){
      const elapsed = performance.now() - animStart;
      let p = Math.min(1, elapsed / MOVE_MS);
      const eased = 1 - Math.pow(1-p, 3);
      robot.position.x = animFrom.x + (animTarget.x - animFrom.x) * eased;
      robot.position.z = animFrom.z + (animTarget.z - animFrom.z) * eased;
      robot.position.y = Math.sin(p*Math.PI) * 0.18;
      robot.rotation.y = Math.sin(p*Math.PI) * 0.15 * (animTarget.x - animFrom.x >= 0 ? 1 : -1);
      if(p >= 1){
        animTarget = null;
        robot.position.y = 0;
        robot.rotation.y = 0;
        checkWin();
      }
    } else if(bumpAnim){
      const elapsed = performance.now() - bumpAnim.start;
      const p = Math.min(1, elapsed / BUMP_MS);
      const wobble = Math.sin(p * Math.PI) * 0.22;
      robot.position.x = bumpAnim.base.x + bumpAnim.dir.x * wobble;
      robot.position.z = bumpAnim.base.z + bumpAnim.dir.z * wobble;
      robot.position.y = Math.sin(p * Math.PI) * 0.06;
      if(p >= 1){
        robot.position.x = bumpAnim.base.x;
        robot.position.z = bumpAnim.base.z;
        robot.position.y = 0;
        bumpAnim = null;
      }
    } else {
      robot.position.y = Math.sin(t*2.2) * 0.03;
    }

    renderer.render(scene, camera);
  }

  // ---------- Game logic ----------
  const btnUp = document.getElementById('btn-up');
  const btnDown = document.getElementById('btn-down');
  const btnLeft = document.getElementById('btn-left');
  const btnRight = document.getElementById('btn-right');
  const overlay = document.getElementById('overlay');
  const codeLines = document.getElementById('codeLines');
  const codePanel = document.getElementById('codePanel');
  const codeToggle = document.getElementById('codeToggle');
  const resetBtn = document.getElementById('resetBtn');
  const playAgain = document.getElementById('playAgain');

  let commandLog = [];
  let locked = false;

  function updateButtons(){
    btnUp.disabled    = (robotPos.z <= 0);
    btnDown.disabled  = (robotPos.z >= SIZE-1);
    btnLeft.disabled  = (robotPos.x <= 0);
    btnRight.disabled = (robotPos.x >= SIZE-1);
  }

  function renderCode(){
    if(commandLog.length === 0){
      codeLines.innerHTML = '<span class="empty">// clique nas setas para começar...</span>';
      return;
    }
    codeLines.innerHTML = commandLog.map(function(entry, i){
      const isLast = (i === commandLog.length - 1);
      if(entry.type === 'blocked'){
        return '<div class="line blocked' + (isLast ? ' current' : '') + '">// 🚧 bateu na barreira!</div>';
      }
      return '<div class="line' + (isLast ? ' current' : '') + '">robo.' + entry.text + '();</div>';
    }).join('');
    codePanel.scrollTop = codePanel.scrollHeight;
  }

  function move(dx, dz, cmdName){
    if(locked) return;
    const nx = robotPos.x + dx;
    const nz = robotPos.z + dz;
    if(nx < 0 || nx > SIZE-1 || nz < 0 || nz > SIZE-1) return;
    if(obstacleSet.has(cellKey(nx, nz))){
      locked = true;
      commandLog.push({ type:'blocked' });
      renderCode();
      startBump(dx, dz);
      setTimeout(function(){ locked = false; }, BUMP_MS + 30);
      return;
    }
    locked = true;
    robotPos = { x: nx, z: nz };
    commandLog.push({ type:'cmd', text: cmdName });
    renderCode();
    updateButtons();
    const w = gridToWorld(robotPos.x, robotPos.z);
    animateMoveTo(w.x, w.z);
    setTimeout(function(){ locked = false; }, MOVE_MS + 20);
  }

  btnUp.addEventListener('click', function(){ move(0,-1,'frente'); });
  btnDown.addEventListener('click', function(){ move(0,1,'tras'); });
  btnLeft.addEventListener('click', function(){ move(-1,0,'esquerda'); });
  btnRight.addEventListener('click', function(){ move(1,0,'direita'); });

  function checkWin(){
    if(robotPos.x === starPos.x && robotPos.z === starPos.z){
      launchConfetti();
      overlay.classList.add('show');
    }
  }

  function resetGame(){
    overlay.classList.remove('show');
    robotPos = { x: CENTER, z: CENTER };
    placeRobot(true);
    placeStar();
    generateObstacles();
    commandLog = [];
    renderCode();
    updateButtons();
  }

  resetBtn.addEventListener('click', resetGame);
  playAgain.addEventListener('click', resetGame);
  codeToggle.addEventListener('click', function(){
    codePanel.classList.toggle('show');
  });

  function launchConfetti(){
    const colors = ['#4A7BF7','#FFD34D','#FF5D5D','#7BC96F','#B57BFF'];
    for(let i=0;i<60;i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random()*100 + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration = (2 + Math.random()*1.5) + 's';
      el.style.animationDelay = (Math.random()*0.4) + 's';
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 4200);
    }
  }

  updateButtons();
  renderCode();
  resize();
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
